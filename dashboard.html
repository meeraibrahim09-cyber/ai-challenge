<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Summer at TEC — Dashboard</title>
  <meta name="description" content="Registered teams dashboard." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="Summer at TEC" />
    </div>
    <nav class="topbar-actions">
      <a class="pill-link" href="index.html" data-i18n="nav_form">Register</a>
      <a class="pill-link active" href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
      <button type="button" class="pill-button" id="lang-toggle" data-i18n="lang_toggle">العربية</button>
    </nav>
  </header>

  <div class="hero">
    <div class="hero-inner">
      <p class="hero-eyebrow" data-i18n="campaign">Summer at TEC</p>
      <h1 data-i18n="dashboard_title">Submitted teams</h1>
    </div>
  </div>

  <main>
    <div class="dashboard-wrap">
      <div class="dashboard-header">
        <p class="subtitle" data-i18n="dashboard_subtitle" style="margin:0">Live list of registered teams.</p>
        <button type="button" class="pill-link" id="refresh-btn" data-i18n="dashboard_refresh">Refresh</button>
      </div>

      <div class="table-card">
        <table id="submissions-table" hidden>
          <thead>
            <tr>
              <th data-i18n="col_team_name">Team name</th>
              <th data-i18n="col_total_members">Count</th>
              <th data-i18n="col_members">Members</th>
              <th data-i18n="col_option">Option</th>
              <th data-i18n="col_area">Area</th>
              <th data-i18n="col_submitted">Submitted</th>
            </tr>
          </thead>
          <tbody id="submissions-body"></tbody>
        </table>
        <p class="dashboard-message" id="dashboard-message" data-i18n="dashboard_loading">Loading submissions...</p>
      </div>
    </div>
  </main>

  <footer>&copy; TEC</footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
