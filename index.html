<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Summer at TEC — Team Registration</title>
  <meta name="description" content="Team registration form." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="https://meeraibrahim09-cyber.github.io/ai-challenge/assets/logo.png" alt="Summer at TEC" />
    </div>
    <nav class="topbar-actions">
      <a class="pill-link active" href="index.html" data-i18n="nav_form">Register</a>
      <a class="pill-link" href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
      <button type="button" class="pill-button" id="lang-toggle" data-i18n="lang_toggle">العربية</button>
    </nav>
  </header>

  <div class="hero">
    <div class="hero-inner">
      <p class="hero-eyebrow" data-i18n="campaign">Summer at TEC</p>
      <h1 data-i18n="page_title">Team Registration</h1>
    </div>
  </div>

  <main>
    <div class="card">
      <p class="subtitle" data-i18n="subtitle">Fill in your team's details below.</p>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="team_name" data-i18n="label_team_name">Team name</label>
          <input type="text" id="team_name" name="team_name" maxlength="150" required />
          <p class="error" data-error-for="team_name"></p>
        </div>

        <div class="field">
          <label for="total_members" data-i18n="label_total_members">Total members</label>
          <input type="number" id="total_members" name="total_members" min="1" step="1" inputmode="numeric" required />
          <p class="error" data-error-for="total_members"></p>
        </div>

        <div class="field">
          <label data-i18n="label_members">Team member names</label>
          <div id="members-list" class="members-list"></div>
          <button type="button" id="add-member-btn" class="add-member-btn" data-i18n="add_member">Add member</button>
          <p class="error" data-error-for="members"></p>
        </div>

        <div class="field">
          <label data-i18n="label_option">Choose options</label>
          <div class="radio-group" role="group">
            <label class="radio-option">
              <input type="checkbox" name="option" value="solution" class="option-checkbox" />
              <span data-i18n="option_solution">Develop a solution using AI for the domains proposed in the Executive Council</span>
            </label>
          </div>
          <p class="error" data-error-for="option"></p>
        </div>

        <div class="field">
          <label id="area-label" data-i18n="label_area">Selected areas</label>
          <div class="multiselect" id="area-select">
            <button type="button" class="multiselect-trigger" id="area-trigger" aria-haspopup="true" aria-expanded="false">
              <span id="area-value" class="multiselect-placeholder" data-i18n="area_placeholder">Choose areas</span>
              <span class="multiselect-caret" aria-hidden="true"></span>
            </button>
            <div class="multiselect-panel" id="area-panel" role="group" aria-labelledby="area-label" hidden></div>
          </div>
          <p class="error" data-error-for="area"></p>
        </div>

        <button type="submit" id="submit-btn" data-i18n="submit">Submit</button>

        <p class="status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <footer>&copy; TEC</footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="form.js"></script>
</body>
</html>
